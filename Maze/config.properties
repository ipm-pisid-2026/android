# Maze Android configuration
# This file is for developer usage, scripts, and deployment notes.

# General app metadata
app.name=Maze
app.package=com.maze
app.version=1.0

# Build/runtime target
run.mode=emulator
run.order=emulator-then-phone

# Emulator settings
emulator.avd=Pixel_6_API_35
emulator.host=10.0.2.2
emulator.note=Use this host when the app runs inside the Android emulator.

# Physical device settings
phone.host=192.168.1.100
phone.install.method=adb
phone.usb.debugging=true
phone.note=Replace phone.host with the IP or hostname of the machine running the backend/API.

# Backend endpoints
backend.python_api_port=5000
backend.python_api_base=/api
backend.note=The Android app reads the backend host at login and talks directly to the Python API.

# Recommended workflow
workflow.step.1=Run the app on the emulator first.
workflow.step.2=Verify temperature, sound, messages, and occupancy charts.
workflow.step.3=Install the APK on the physical phone.
workflow.step.4=Update phone.host to the backend machine IP before the final demo.
